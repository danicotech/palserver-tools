<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="Segoe UI, Noto Sans TC, PingFang TC, sans-serif" font-size="15"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect width="940" height="320" rx="16" fill="#f8fafc"/><text x="40" y="42" font-weight="bold" font-size="18">🧑‍🔧 本機共玩(4 人邀請碼)存檔:主機角色要「過戶」一次</text><text x="40" y="66" fill="#64748b" font-size="13.5">共玩主機的角色綁在通用 ID;其他玩家不受影響,直接進來就是原角色</text><rect x="30" y="92" width="186" height="130" rx="14" fill="#fff" stroke="#38bdf8" stroke-width="2.5" filter="url(#sh)"/><circle cx="54" cy="116" r="16" fill="#38bdf8"/><text x="54" y="122" text-anchor="middle" fill="#fff" font-weight="bold" font-size="17">1</text><text x="123" y="140" text-anchor="middle" font-weight="bold" font-size="15.5">主機加入一次</text><text x="123" y="166" text-anchor="middle" fill="#64748b" font-size="12.5">開服後,主機用自己的</text><text x="123" y="187" text-anchor="middle" fill="#64748b" font-size="12.5">帳號登入(產生新空角色檔)</text><rect x="262" y="92" width="186" height="130" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2.5" filter="url(#sh)"/><circle cx="286" cy="116" r="16" fill="#f59e0b"/><text x="286" y="122" text-anchor="middle" fill="#fff" font-weight="bold" font-size="17">2</text><text x="355" y="140" text-anchor="middle" font-weight="bold" font-size="15.5">停止伺服器</text><text x="355" y="166" text-anchor="middle" fill="#64748b" font-size="12.5">stop.bat</text><text x="355" y="187" text-anchor="middle" fill="#64748b" font-size="12.5">(修復要在離線狀態做)</text><rect x="494" y="92" width="186" height="130" rx="14" fill="#fff" stroke="#a855f7" stroke-width="2.5" filter="url(#sh)"/><circle cx="518" cy="116" r="16" fill="#a855f7"/><text x="518" y="122" text-anchor="middle" fill="#fff" font-weight="bold" font-size="17">3</text><text x="587" y="140" text-anchor="middle" font-weight="bold" font-size="15.5">執行修復工具</text><text x="587" y="166" text-anchor="middle" fill="#64748b" font-size="12.5">palworld-host-save-fix:</text><text x="587" y="187" text-anchor="middle" fill="#64748b" font-size="12.5">把舊角色過戶到新角色檔</text><rect x="726" y="92" width="186" height="130" rx="14" fill="#fff" stroke="#22c55e" stroke-width="2.5" filter="url(#sh)"/><circle cx="750" cy="116" r="16" fill="#22c55e"/><text x="750" y="122" text-anchor="middle" fill="#fff" font-weight="bold" font-size="17">4</text><text x="819" y="140" text-anchor="middle" font-weight="bold" font-size="15.5">重啟 → 完成</text><text x="819" y="166" text-anchor="middle" fill="#64748b" font-size="12.5">主機用原本的角色</text><text x="819" y="187" text-anchor="middle" fill="#64748b" font-size="12.5">回到遊戲!</text><line x1="222" y1="157" x2="256" y2="157" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arr)"/><line x1="454" y1="157" x2="488" y2="157" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arr)"/><line x1="686" y1="157" x2="720" y2="157" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arr)"/><rect x="30" y="248" width="880" height="52" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/><text x="470" y="270" text-anchor="middle" fill="#15803d" font-size="13.5">💾 修復前務必先備份整個世界資料夾;工具:github.com/xNul/palworld-host-save-fix</text><text x="470" y="291" text-anchor="middle" fill="#15803d" font-size="13.5">修復後公會顯示異常?讓該玩家退出公會再重新加入即可</text></svg>
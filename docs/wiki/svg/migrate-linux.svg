<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 436" font-family="Segoe UI, Noto Sans TC, PingFang TC, sans-serif" font-size="15"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect width="980" height="436" rx="16" fill="#f8fafc"/><text x="34" y="42" font-weight="bold" font-size="19">🚚 Linux / macOS:把舊伺服器的世界搬進本專案</text><rect x="30" y="66" width="400" height="212" rx="14" fill="#fff" stroke="#f97316" stroke-width="2.5" filter="url(#sh)"/><rect x="30" y="66" width="400" height="38" rx="14" fill="#f97316"/><rect x="30" y="90" width="400" height="14" fill="#f97316"/><text x="46" y="91" fill="#fff" font-weight="bold" font-size="15">① 來源(舊伺服器 / 掛載目錄)</text><text x="46" y="132" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155" font-weight="normal">Pal/Saved/SaveGames/0/</text><rect x="56" y="144" width="366" height="26" rx="7" fill="#fef3c7" stroke="#f59e0b"/><text x="64" y="162" font-family="Consolas, Menlo, monospace" font-size="13" fill="#92400e" font-weight="bold">&lt;世界GUID&gt;/</text><text x="82" y="192" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155" font-weight="normal">Level.sav</text><text x="82" y="222" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155" font-weight="normal">LevelMeta.sav</text><text x="82" y="252" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155" font-weight="normal">Players/*.sav</text><rect x="550" y="66" width="400" height="212" rx="14" fill="#fff" stroke="#22c55e" stroke-width="2.5" filter="url(#sh)"/><rect x="550" y="66" width="400" height="38" rx="14" fill="#22c55e"/><rect x="550" y="90" width="400" height="14" fill="#22c55e"/><text x="566" y="91" fill="#fff" font-weight="bold" font-size="15">② 目的(本專案資料夾)</text><text x="566" y="132" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155" font-weight="normal">backend/palworld-data/</text><text x="584" y="162" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155" font-weight="normal">Pal/Saved/SaveGames/0/</text><rect x="594" y="174" width="348" height="26" rx="7" fill="#fef3c7" stroke="#f59e0b"/><text x="602" y="192" font-family="Consolas, Menlo, monospace" font-size="13" fill="#92400e" font-weight="bold">&lt;世界GUID&gt;/  ← 貼到這裡</text><rect x="612" y="204" width="330" height="26" rx="7" fill="#e0f2fe" stroke="#0284c7"/><text x="620" y="222" font-family="Consolas, Menlo, monospace" font-size="13" fill="#075985" font-weight="bold">Level.sav  ← 網站讀這一份</text><text x="566" y="252" font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155" font-weight="normal">※ 這層只放一個世界資料夾</text><line x1="440" y1="172.0" x2="536" y2="172.0" stroke="#38bdf8" stroke-width="4" marker-end="url(#arr)"/><text x="488" y="158.0" text-anchor="middle" fill="#0284c7" font-size="13" font-weight="bold">整包複製</text><text x="488" y="198.0" text-anchor="middle" fill="#64748b" font-size="12">連 Players/ 一起</text><rect x="30" y="302" width="920" height="46" rx="10" fill="#0f172a"/><text x="46" y="322" fill="#94a3b8" font-size="11.5">在專案根目錄執行(-a 保留權限與時間戳):</text><text x="46" y="340" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#e2e8f0">cp -a /舊路徑/Pal/Saved/SaveGames/0/&lt;世界GUID&gt; backend/palworld-data/Pal/Saved/SaveGames/0/</text><rect x="30" y="360" width="920" height="32" rx="8" fill="#fef2f2" stroke="#fecaca"/><text x="46" y="381" fill="#b91c1c" font-size="13">⚠️ 複製前兩邊都要完全停止:舊伺服器關掉、本專案跑 bash linux/stop.sh(執行中複製會壞檔)</text><rect x="30" y="398" width="920" height="32" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="46" y="419" fill="#15803d" font-size="13">✅ 接著 sudo chown -R 1000:1000 backend/palworld-data,再 bash linux/start.sh → 網站按 🔄</text></svg>
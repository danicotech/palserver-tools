<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="Segoe UI, Noto Sans TC, PingFang TC, sans-serif" font-size="15"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect width="940" height="330" rx="16" fill="#f8fafc"/><text x="40" y="42" font-weight="bold" font-size="18">🎯 伺服器怎麼決定載入哪個世界?(手動搬家失敗 9 成在這)</text><rect x="40" y="80" width="330" height="110" rx="14" fill="#fff" stroke="#38bdf8" stroke-width="2.5" filter="url(#sh)"/><text x="60" y="110" font-weight="bold">GameUserSettings.ini</text><rect x="60" y="126" width="290" height="34" rx="8" fill="#eff6ff"/><text x="70" y="149" font-size="14" fill="#1d4ed8">DedicatedServerName=<tspan font-weight="bold">ABC123</tspan></text><rect x="560" y="70" width="330" height="64" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="3" filter="url(#sh)"/><text x="580" y="98" font-weight="bold">📁 SaveGames/0/<tspan fill="#15803d">ABC123</tspan>/</text><text x="580" y="120" fill="#15803d" font-size="13.5">✓ 名稱對上 → 載入這個世界</text><rect x="560" y="150" width="330" height="64" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="580" y="178" font-weight="bold" fill="#94a3b8">📁 SaveGames/0/DEF456/</text><text x="580" y="200" fill="#94a3b8" font-size="13.5">沒被指到 → 完全不會載入</text><line x1="370" y1="130" x2="556" y2="102" stroke="#22c55e" stroke-width="3.5" marker-end="url(#arr)"/><rect x="40" y="240" width="850" height="66" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="60" y="266" fill="#b91c1c" font-size="14" font-weight="bold">❌ 名稱沒對上會發生什麼?伺服器不會報錯 —— 它默默開一個全新空白世界!</text><text x="60" y="290" fill="#7f1d1d" font-size="13.5">保險做法:SaveGames/0/ 底下只放一個世界資料夾,並確認 ini 的 DedicatedServerName 等於該資料夾名</text></svg>
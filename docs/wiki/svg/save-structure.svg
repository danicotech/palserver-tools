<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Segoe UI, Noto Sans TC, PingFang TC, sans-serif" font-size="15"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect width="940" height="400" rx="16" fill="#f8fafc"/><text x="40" y="45" font-weight="bold" font-size="18">📂 存檔長什麼樣?(只需要搬 ★ 那一個資料夾)</text><rect x="60" y="80" width="340" height="34" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="72" y="103" font-weight="bold" font-size="14">Pal/Saved/</text><rect x="100" y="125" width="340" height="34" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/><text x="112" y="148" font-weight="bold" font-size="14">SaveGames/0/&lt;世界GUID&gt;/</text><text x="454" y="148" fill="#b45309" font-size="13.5" font-weight="bold">★ 你的世界 —— 整個資料夾就是要搬的東西</text><rect x="140" y="170" width="300" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="152" y="193" font-weight="normal" font-size="14">Level.sav</text><text x="454" y="193" fill="#64748b" font-size="13.5" font-weight="normal">世界本體:建築、帕魯、地形</text><rect x="140" y="210" width="300" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="152" y="233" font-weight="normal" font-size="14">LevelMeta.sav / WorldOption.sav</text><text x="454" y="233" fill="#64748b" font-size="13.5" font-weight="normal">世界資訊與建立時的設定快照</text><rect x="140" y="250" width="300" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="152" y="273" font-weight="normal" font-size="14">Players/&lt;PlayerUid&gt;.sav</text><text x="454" y="273" fill="#64748b" font-size="13.5" font-weight="normal">每位玩家一個角色檔</text><rect x="100" y="300" width="340" height="34" rx="8" fill="#e0f2fe" stroke="#f59e0b" stroke-width="2.5"/><text x="112" y="323" font-weight="bold" font-size="14">Config/.../GameUserSettings.ini</text><text x="454" y="323" fill="#b45309" font-size="13.5" font-weight="bold">★ DedicatedServerName= 決定「載入哪個世界」(見下圖)</text><g stroke="#94a3b8" stroke-width="1.5"><line x1="80" y1="114" x2="80" y2="317" /><line x1="80" y1="142" x2="100" y2="142"/><line x1="80" y1="317" x2="100" y2="317"/><line x1="120" y1="159" x2="120" y2="267" /><line x1="120" y1="187" x2="140" y2="187"/><line x1="120" y1="227" x2="140" y2="227"/><line x1="120" y1="267" x2="140" y2="267"/></g><rect x="60" y="352" width="820" height="34" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/><text x="470" y="374" text-anchor="middle" fill="#15803d" font-size="13.5">💡 不要複製舊的 GameUserSettings.ini(夾帶舊主機 IP/RCON 設定);只搬 ★ 世界資料夾即可</text></svg>
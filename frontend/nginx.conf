server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 反向代理：讓外部只需開 8080 即可取得後端資料（帕魯 / 排程狀態 / 伺服器指標）。
    # token 由 nginx 端注入（瀏覽器不需持有）；只代理下列端點，
    # 完全不含 /api/start、/api/stop、/api/rcon、/api/rest/kick 等控制端點，故公開也安全。
    # roster 為玩家自助設定頭像的低風險寫入（僅名稱+帕魯代號），其餘皆唯讀。
    # 用變數 + Docker 內建 resolver，讓後端容器 IP 變動時仍能正確解析。
    location ~ ^/api/(pals|status|presence|roster|rest/(metrics|info|players|settings)) {
        resolver 127.0.0.11 valid=30s;
        set $sched "scheduler:9000";
        proxy_pass http://$sched$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer CHANGE_THIS_TOKEN_TO_A_LONG_RANDOM_STRING";
        proxy_read_timeout 120s;
    }

    # SPA：找不到實體檔就回 index.html（單頁應用不會 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 大型離線素材 / JS / CSS 壓縮傳輸
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # 靜態資源長快取（檔名含 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 地圖圖磚:一次要抓幾十張,而且內容永不改變(要換底圖是換整包)。
    # 沒有這段的話每次進站每張圖磚都要回來問一次(即使回 304 也是一個來回),
    # 幾十個來回就是肉眼可見的延遲。給一年的 immutable,第二次之後完全不連線。
    #
    # 前綴一定要寫 ^~ —— nginx 的 regex location 優先於一般前綴 location,
    # 少了它就會被下面那條副檔名規則接手,圖磚只拿到 7 天。
    location ^~ /map-tiles/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;   # 幾千張圖磚會把 log 洗掉
    }

    # 地圖底圖與其他圖片素材(檔名不含 hash,給短一點並允許重新驗證)
    location ~* \.(png|jpe?g|webp|avif)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}

# ─────────── 瀏覽統計(純本機,不連任何外部統計服務)───────────
#
# 為什麼不直接看 access.log:那份一天六千多行,絕大多數是圖磚和靜態檔,
# 而且寫在容器裡 —— 2026-08-04 重建前端容器時,先前六天的紀錄就這樣沒了。
# 所以另外開一份只記「一次瀏覽」的 hits.log,一天只長幾十 KB,
# 掛 volume 落地後可以永久保留(見 docker-compose.yml 的 panel 服務)。
#
# 記兩種事件:
#   _enter … 進站(GET /)
#   其他   … 前端切分頁時送的 /_hit?p=<分頁> 信標(SPA 切分頁不會產生頁面請求)
map $request_uri $hit_page {
    default                          "";
    "/"                              "_enter";
    "/index.html"                    "_enter";
    "~^/\?"                          "_enter";
    "~^/_hit\?p=([a-z0-9_-]{1,24})$" $1;
}

# access_log 的 if= 只認「非空且非 0」,所以把「不是瀏覽事件」映射成 0。
map $hit_page $is_hit {
    ""      0;
    default 1;
}

# Tab 分隔,方便 tools/site-stats.ps1 直接切欄位。
log_format hits '$time_iso8601	$hit_page	$remote_addr	$http_cf_ipcountry	$http_user_agent';

# ─────────── 上傳存檔分析的流量閘門 ───────────
# 這兩個 zone 給 /api/pals/analyze 用。宣告要放在 server{} 外面（http 層），
# 10m 的共享記憶體約可追蹤十六萬個來源位址，綽綽有餘。
limit_req_zone  $binary_remote_addr zone=analyze:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=analyze_conn:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 訪客真實 IP:站在 cloudflared 後面時 $remote_addr 只會是容器 IP(172.19.0.x),
    # 所有人看起來都是同一個訪客。信任 docker/區網來源送進來的 CF-Connecting-IP,
    # 讓 $remote_addr 還原成真正的訪客位址。
    # 沒走 Cloudflare 的自架情境不會帶這個 header,$remote_addr 就維持原樣。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # 完整存取紀錄留在 docker logs(compose 那邊設了 10MB×3 自動輪替);
    # 瀏覽事件另外落地成檔案,永久保留。
    access_log /dev/stdout main;
    access_log /var/log/nginx/hits.log hits if=$is_hit;
    error_log  /dev/stderr warn;

    # 分頁瀏覽信標:前端切分頁時送這裡,只為了留下 hits.log 的一行,不回傳內容。
    location = /_hit {
        return 204;
    }

    # 反向代理：讓外部只需開 8080 即可取得後端資料（帕魯 / 排程狀態 / 伺服器指標）。
    # token 由 nginx 端注入（瀏覽器不需持有）；只代理下列端點，
    # 完全不含 /api/start、/api/stop、/api/rcon、/api/rest/kick 等控制端點，故公開也安全。
    # roster 為玩家自助設定頭像的低風險寫入（僅名稱+帕魯代號），其餘皆唯讀。
    # 用變數 + Docker 內建 resolver，讓後端容器 IP 變動時仍能正確解析。
    # ⚠️ 一定要擋在代理規則前面。
    # 下面那條 regex 的 `pals` 沒有結尾錨，`/api/palsave/source` 的前四個字剛好是
    # `pals`，會一起被放行 —— 而 POST /api/palsave/source 可以把整台伺服器要讀的
    # 存檔目錄換成任意絕對路徑。那是管理者操作，不能對公網開放。
    # 要用它請直接打排程器的 9000 埠並帶上 API token（不經過這個公開入口）。
    # ^~ 讓一般前綴 location 贏過 regex location，否則這條不會生效。
    location ^~ /api/palsave/ {
        return 404;
    }

    location ~ ^/api/(pals|status|presence|roster|rest/(metrics|info|players|settings)) {
        resolver 127.0.0.11 valid=30s;
        set $sched "scheduler:9000";
        proxy_pass http://$sched$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer CHANGE_THIS_TOKEN_TO_A_LONG_RANDOM_STRING";
        proxy_read_timeout 120s;
    }

    # 上傳自己的 Level.sav 做分析。獨立一條 location 是為了「只有這裡」放寬
    # 上傳限制 —— 其餘 API 維持 nginx 預設的 1m，不會因為這個功能一起變成大門。
    location = /api/pals/analyze {
        resolver 127.0.0.11 valid=30s;
        set $sched "scheduler:9000";
        proxy_pass http://$sched$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer CHANGE_THIS_TOKEN_TO_A_LONG_RANDOM_STRING";

        # 存檔動輒幾十 MB，而 nginx 預設上限是 1m —— 少了這行瀏覽器只會拿到 413，
        # 前端看起來像「按了沒反應」。上限對齊後端的 512 MB。
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 關掉請求緩衝：預設 nginx 會把整份上傳先寫進 client_temp 暫存檔再轉給後端。
        # 對使用者的承諾是「存檔不會在伺服器上落地」，這裡直接串流轉發，
        # 全程只經過記憶體，磁碟上不會出現任何存檔副本。
        proxy_request_buffering off;
        proxy_http_version 1.1;

        # 這是站上唯一吃大流量又吃 CPU 的端點（一次解析要幾秒）。
        # 不限流的話，一個人連續丟幾百 MB 就能把整台拖垮。
        # 正常使用者一分鐘不會傳超過三次。
        limit_req zone=analyze burst=2 nodelay;
        limit_req_status 429;
        limit_conn analyze_conn 2;
    }

    # SPA：找不到實體檔就回 index.html（單頁應用不會 404）
    #
    # ⚠️ Cache-Control 這行不能拿掉。index.html 與 announcement.md / i18n/ 這些
    # 檔名不含 hash,少了明確的快取指示,瀏覽器會啟用「啟發式快取」自己決定存多久
    # (約 (現在 - Last-Modified) 的 10%)。於是重建前端後:
    #   老訪客拿到快取裡的舊 index.html → 它指向已被刪掉的 /assets/index-舊hash.js
    #   → 404 → 白畫面,要按 F5 或開無痕才會好。
    # no-cache 不是「不准存」,是「每次都要回來驗證」;配上 ETag 通常只換到一個
    # 幾百 bytes 的 304,成本極低。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 遊戲資料(圖鑑/配種/地圖標記…):檔名同樣不含 hash,但總量 41MB、
    # 只有改版跑過 tools/fetch-*.mjs 才會變。給一小時,到期後靠 ETag 驗證 ——
    # 不像 index.html 那樣每次都問(幾十個 JSON 就是幾十個來回),也不會卡著舊資料太久。
    #
    # 用一般前綴而非 ^~:讓底下的圖片規則仍優先接手 game-data/ 裡的
    # item-icons、map-icons 等幾千張圖(那些維持 7 天),這裡只管 .json / .md。
    location /game-data/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # 大型離線素材 / JS / CSS 壓縮傳輸
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # 靜態資源長快取（檔名含 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 地圖圖磚:一次要抓幾十張,而且內容永不改變(要換底圖是換整包)。
    # 沒有這段的話每次進站每張圖磚都要回來問一次(即使回 304 也是一個來回),
    # 幾十個來回就是肉眼可見的延遲。給一年的 immutable,第二次之後完全不連線。
    #
    # 前綴一定要寫 ^~ —— nginx 的 regex location 優先於一般前綴 location,
    # 少了它就會被下面那條副檔名規則接手,圖磚只拿到 7 天。
    location ^~ /map-tiles/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;   # 幾千張圖磚會把 log 洗掉
    }

    # 地圖底圖與其他圖片素材(檔名不含 hash,給短一點並允許重新驗證)
    location ~* \.(png|jpe?g|webp|avif)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }
}
